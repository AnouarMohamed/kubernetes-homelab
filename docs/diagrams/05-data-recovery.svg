t-size="22" fill="#17856b">Standby</text><text x="938" y="333" font-size="16" fill="#425972">Streaming replication</text><rect x="920" y="435" width="300" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="932" y="451" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="949" y="472" font-size="22" fill="#17856b">Standby</text><text x="938" y="503" font-size="16" fill="#425972">Streaming replication</text><rect x="90" y="815" width="300" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="102" y="831" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="119" y="852" font-size="22" fill="#17856b">PVC / volume engine</text><text x="108" y="883" font-size="16" fill="#425972">Workload volume mount</text><rect x="490" y="815" width="325" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="502" y="831" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="519" y="852" font-size="22" fill="#17856b">pc-1 replica</text><text x="508" y="883" font-size="16" fill="#425972">Node-local backing disk</text><rect x="855" y="815" width="325" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="867" y="831" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="884" y="852" font-size="22" fill="#17856b">pc-2 replica</text><text x="873" y="883" font-size="16" fill="#425972">Node-local backing disk</text><rect x="1220" y="815" width="325" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1232" y="831" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="1249" y="852" font-size="22" fill="#17856b">pc-3 replica</text><text x="1238" y="883" font-size="16" fill="#425972">Node-local backing disk</text><rect x="1730" y="310" width="370" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1742" y="326" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="1759" y="347" font-size="22" fill="#17856b">CNPG backup + WAL</text><text x="1748" y="378" font-size="16" fill="#425972">Base backups + archive history</text><rect x="1730" y="815" width="370" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1742" y="831" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="1759" y="852" font-size="22" fill="#17856b">Longhorn backup</text><text x="1748" y="883" font-size="16" fill="#425972">Separate backupstore objects</text><rect x="80" y="1190" width="380" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="92" y="1206" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="109" y="1227" font-size="22" fill="#17856b">Velero + CSI</text><text x="98" y="1258" font-size="16" fill="#425972">Objects + snapshot references</text><rect x="640" y="1190" width="380" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="652" y="1206" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="669" y="1227" font-size="22" fill="#17856b">k3s etcd snapshots</text><text x="658" y="1258" font-size="16" fill="#425972">Kubernetes control-plane state</text><rect x="1730" y="1190" width="370" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1742" y="1206" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="1759" y="1227" font-size="22" fill="#17856b">Separate backup prefixes</text><text x="1748" y="1258" font-size="16" fill="#425972">Velero metadata / etcd snapshots</text><text x="85" y="1114" font-size="19" fill="#273d55">Restore boundaries: database PITR ≠ volume restore ≠ Kubernetes object restore ≠ etcd cluster recovery.</text><text x="48" y="1412" font-size="17" fill="#596b82">Longhorn/CNPG formal restore drills remain pending. Velero CSI restore + checksum were observed; CSI snapshots alone are not off-cluster copies.</text><text x="48" y="1450" font-size="16" fill="#596b82">Blue: platform / application traffic     Green: persistence     Purple: identity / secrets     Orange: external services</text></g></svg>
