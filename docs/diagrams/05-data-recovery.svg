<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500" role="img" aria-labelledby="title desc"><title id="title">Kubernetes homelab — Storage topology · replicas, PostgreSQL backups and independent recovery paths</title><desc id="desc">Longhorn/CNPG formal restore drills remain pending. Velero CSI restore + checksum were observed; CSI snapshots alone are not off-cluster copies.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#326ce5"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c86a12"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17856b"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8054bd"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64e64"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#596b82"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="2200" height="1500" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="48" y="69" font-size="43" fill="#162c47">Kubernetes homelab</text><text x="49" y="110" font-size="23" fill="#596b82">Storage topology · replicas, PostgreSQL backups and independent recovery paths</text><rect x="50" y="180" width="1540" height="400" rx="12" fill="#eef9f4" stroke="#17856b" stroke-width="1.5" stroke-dasharray="8 6"/><text x="70" y="213" font-size="20" fill="#17856b">Database layer / CloudNativePG</text><text x="70" y="237" font-size="15" fill="#596b82">Primary and replica placement shown logically; not a claim about the final AWS evidence profile</text><rect x="50" y="670" width="1540" height="400" rx="12" fill="#eef9f4" stroke="#17856b" stroke-width="1.5" stroke-dasharray="8 6"/><text x="70" y="703" font-size="20" fill="#17856b">Persistent-volume layer / Longhorn</text><text x="70" y="727" font-size="15" fill="#596b82">Three storage replicas protect against a node/disk loss; they are not independent backups</text><rect x="1690" y="180" width="450" height="1150" rx="12" fill="#eef9f4" stroke="#17856b" stroke-width="1.5" stroke-dasharray="8 6"/><text x="1710" y="213" font-size="20" fill="#17856b">Off-cluster object storage</text><polyline points="390,360 490,360" fill="none" stroke="#17856b" stroke-width="2"  marker-end="url(#green)"/><rect x="424.8" y="334" width="33.4" height="24" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="429.8" y="350" font-size="14" fill="#17856b">SQL</text><polyline points="810,360 860,360 860,315 920,315" fill="none" stroke="#17856b" stroke-width="2"  marker-end="url(#green)"/><rect x="815" y="283" width="88" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="820" y="299" font-size="14" fill="#17856b">WAL stream</text><polyline points="810,360 860,360 860,485 920,485" fill="none" stroke="#17856b" stroke-width="2"  marker-end="url(#green)"/><polyline points="650,310 650,240 1915,240 1915,310" fill="none" stroke="#17856b" stroke-width="2"  marker-end="url(#green)"/><rect x="1275" y="213" width="173.79999999999998" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1280" y="229" font-size="14" fill="#17856b">archive / base backup</text><polyline points="390,865 430,865 430,780 652.5,780 652.5,815" fill="none" stroke="#17856b" stroke-width="2"  marker-end="url(#green)"/><rect x="445" y="749" width="119.2" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="450" y="765" font-size="14"