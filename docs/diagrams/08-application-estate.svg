<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500" role="img" aria-labelledby="title desc"><title id="title">Kubernetes homelab — Application dependencies · Sentinel and self-hosted services</title><desc id="desc">Logical dependencies, not a claim that every application was Healthy in AWS. Vaultwarden is not shown as a Keycloak OIDC client.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#326ce5"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c86a12"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17856b"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8054bd"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64e64"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#596b82"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="2200" height="1500" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="48" y="69" font-size="43" fill="#162c47">Kubernetes homelab</text><text x="49" y="110" font-size="23" fill="#596b82">Application dependencies · Sentinel and self-hosted services</text><rect x="50" y="180" width="2100" height="560" rx="12" fill="#eff5ff" stroke="#326ce5" stroke-width="1.5" stroke-dasharray="8 6"/><text x="70" y="213" font-size="20" fill="#326ce5">Homelab Sentinel / staging and production overlays</text><rect x="50" y="830" width="670" height="500" rx="12" fill="#f6f1fc" stroke="#8054bd" stroke-width="1.5" stroke-dasharray="8 6"/><text x="70" y="863" font-size="20" fill="#8054bd">Credential and identity services</text><rect x="790" y="830" width="670" height="500" rx="12" fill="#eff5ff" stroke="#326ce5" stroke-width="1.5" stroke-dasharray="8 6"/><text x="810" y="863" font-size="20" fill="#326ce5">Operator discovery and independent uptime</text><rect x="1530" y="830" width="620" height="500" rx="12" fill="#eef9f4" stroke="#17856b" stroke-width="1.5" stroke-dasharray="8 6"/><text x="1550" y="863" font-size="20" fill="#17856b">Shared operational dependencies</text><polyline points="400,340 530,355" fill="none" stroke="#326ce5" stroke-width="2"  marker-end="url(#blue)"/><rect x="443" y="321.5" width="49" height="24" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="448" y="337.5" font-size="14" fill="#326ce5">HTTPS</text><polyline points="725,420 725,535 1090,535" fill="none" stroke="#17856b" stroke-width="2"  marker-end="url(#green)"/><rect x="865" y="505" width="72.4" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="870" y="521" font-size="14" fill="#17856b">read SQL</text><polyline points="1290,390 1290,470" fill="none" stroke="#17856b" stroke-width="2"  marker-end="url(#green)"/><rect x="1305" y="423" width="142.6" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1310" y="439" font-size="14" fill="#17856b">write transitions</text><polyline points="1490,340 1670,355" fill="none" stroke="#326ce5" stroke-width="2"  marker-end="url(#blue)"/><rect x="1541" y="321.5" width="88" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1546" y="337.5" font-size="14" fill="#326ce5">probe HTTP</text><polyline points="370,975 450,975" fill="none" stroke="#17856b" stroke-width="2"  marker-end="url(#green)"/><rect x="394.8" y="949" width="33.4" height="24" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="399.8" y="965" font-size="14" fill="#17856b">SQL</text><polyline points="370,1200 450,1200" fill="none" stroke="#17856b" stroke-width="2"  marker-end="url(#green)"/><rect x="394.8" y="1174" width="33.4" height="24" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="399.8" y="1190" font-size="14" fill="#17856b">SQL</text><polyline points="1410,1200 1500,1200 1500,975 1570,975" fill="none" stroke="#17856b" stroke-width="2"  marker-end="url(#green)"/><rect x="1465" y="1058" width="33.4" height="24" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1470" y="1074" font-size="14" fill="#17856b">PVC</text><rect x="90" y="290" width="310" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="102" y="306" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="119" y="327" font-size="22" fill="#326ce5">Public browser</text><text x="108" y="358" font-size="16" fill="#425972">Read-only status</text><rect x="530" y="290" width="390" height="130" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="542" y="306" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="559" y="327" font-size="22" fill="#326ce5">Go API / status UI</text><text x="548" y="358" font-size="16" fill="#425972">/api/v1/status</text><text x="548" y="379.6" font-size="16" fill="#425972">Internal health + metrics + OTLP</text><rect x="1090" y="470" width="400" height="130" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1102" y="486" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="1119" y="507" font-size="22" fill="#17856b">Sentinel CNPG</text><text x="1108" y="538" font-size="16" fill="#425972">Service state + transition history</text><text x="1108" y="559.6" font-size="16" fill="#425972">Schema migrations · WAL archive</text><rect x="1090" y="290" width="400" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1102" y="306" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1119" y="327" font-size="22" fill="#326ce5">Go probe worker</text><text x="1108" y="358" font-size="16" fill="#425972">Internal configured probes</text><rect x="1670" y="290" width="430" height="130" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1682" y="306" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1699" y="327" font-size="22" fill="#326ce5">Selected services</text><text x="1688" y="358" font-size="16" fill="#425972">Explicit probe targets</text><text x="1688" y="379.6" font-size="16" fill="#425972">Public selection is read-only</text><text x="90" y="581" font-size="21" fill="#273d55">API has no public write endpoint.</text><text x="90" y="609.35" font-size="21" fill="#273d55">Probe configuration stays internal.</text><text x="90" y="637.7" font-size="21" fill="#273d55">No Redis dependency.</text><rect x="90" y="925" width="280" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="102" y="941" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="119" y="962" font-size="22" fill="#8054bd">Vaultwarden</text><text x="108" y="993" font-size="16" fill="#425972">Private credentials app</text><rect x="450" y="925" width="230" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="462" y="941" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="479" y="962" font-size="22" fill="#17856b">CNPG</text><text x="468" y="993" font-size="16" fill="#425972">Vaultwarden DB</text><rect x="90" y="1150" width="280" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="102" y="1166" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="119" y="1187" font-size="22" fill="#8054bd">Keycloak</text><text x="108" y="1218" font-size="16" fill="#425972">Argo CD / Grafana SSO</text><rect x="450" y="1150" width="230" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="462" y="1166" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="479" y="1187" font-size="22" fill="#17856b">CNPG</text><text x="468" y="1218" font-size="16" fill="#425972">Identity DB</text><rect x="830" y="925" width="580" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="842" y="941" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="859" y="962" font-size="22" fill="#326ce5">Homepage</text><text x="848" y="993" font-size="16" fill="#425972">Navigation links to internal services</text><rect x="830" y="1150" width="580" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="842" y="1166" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="859" y="1187" font-size="22" fill="#326ce5">Uptime Kuma</text><text x="848" y="1218" font-size="16" fill="#425972">Own uptime checks · persistent application data</text><rect x="1570" y="925" width="540" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1582" y="941" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="1599" y="962" font-size="22" fill="#17856b">Longhorn / backup coverage</text><text x="1588" y="993" font-size="16" fill="#425972">PVC-backed services + per-database S3 backups</text><rect x="1570" y="1150" width="540" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1582" y="1166" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1599" y="1187" font-size="22" fill="#326ce5">Policies / monitoring / budgets</text><text x="1588" y="1218" font-size="16" fill="#425972">Namespace policies · resource requests and limits</text><text x="48" y="1412" font-size="17" fill="#596b82">Logical dependencies, not a claim that every application was Healthy in AWS. Vaultwarden is not shown as a Keycloak OIDC client.</text><text x="48" y="1450" font-size="16" fill="#596b82">Blue: platform / application traffic     Green: persistence     Purple: identity / secrets     Orange: external services</text></g></svg>
