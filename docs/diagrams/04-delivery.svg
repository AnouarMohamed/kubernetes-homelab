lue)"/><rect x="1256.4" y="774" width="41.2" height="24" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1261.4" y="790" font-size="14" fill="#326ce5">sync</text><polyline points="1650,800 1740,800" fill="none" stroke="#326ce5" stroke-width="2"  marker-end="url(#blue)"/><rect x="1662.8" y="774" width="72.4" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1667.8" y="790" font-size="14" fill="#326ce5">analysis</text><polyline points="810,1220 1030,1220" fill="none" stroke="#c86a12" stroke-width="2"  marker-end="url(#orange)"/><rect x="887.8" y="1194" width="72.4" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="892.8" y="1210" font-size="14" fill="#c86a12">workflow</text><polyline points="1420,1220 1620,1220" fill="none" stroke="#c86a12" stroke-width="2"  marker-end="url(#orange)"/><rect x="1467.4" y="1194" width="119.2" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1472.4" y="1210" font-size="14" fill="#c86a12">publish + sign</text><rect x="50" y="240" width="300" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="62" y="256" width="7" height="26" rx="4" fill="#c86a12" stroke="#c86a12" stroke-width="1.5" /><text x="79" y="277" font-size="22" fill="#c86a12">GitLab commit</text><text x="68" y="308" font-size="16" fill="#425972">Source + declarative manifests</text><rect x="480" y="285" width="330" height="130" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="492" y="301" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="509" y="322" font-size="22" fill="#326ce5">Validation</text><text x="498" y="353" font-size="16" fill="#425972">Lint · schemas · tests</text><text x="498" y="374.6" font-size="16" fill="#425972">Gitleaks · policy checks</text><rect x="900" y="285" width="330" height="130" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x