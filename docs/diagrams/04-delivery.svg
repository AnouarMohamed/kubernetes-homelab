72">CMP: yq / Kustomize / KSOPS</text><rect x="1320" y="735" width="330" height="130" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1332" y="751" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1349" y="772" font-size="22" fill="#326ce5">Argo Rollouts</text><text x="1338" y="803" font-size="16" fill="#425972">Canary + stable ReplicaSets</text><text x="1338" y="824.6" font-size="16" fill="#425972">Prometheus analysis</text><rect x="1740" y="735" width="340" height="130" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1752" y="751" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1769" y="772" font-size="22" fill="#326ce5">Traffic decision</text><text x="1758" y="803" font-size="16" fill="#425972">Promote on analysis success</text><text x="1758" y="824.6" font-size="16" fill="#425972">Abort on failed analysis</text><rect x="480" y="1170" width="330" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="492" y="1186" width="7" height="26" rx="4" fill="#c86a12" stroke="#c86a12" stroke-width="1.5" /><text x="509" y="1207" font-size="22" fill="#c86a12">GitHub mirror</text><text x="498" y="1238" font-size="16" fill="#425972">Source / package definitions</text><rect x="1030" y="1170" width="390" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1042" y="1186" width="7" height="26" rx="4" fill="#c86a12" stroke="#c86a12" stroke-width="1.5" /><text x="1059" y="1207" font-size="22" fill="#c86a12">GitHub Actions</text><text x="1048" y="1238" font-size="16" fill="#425972">Six application OCI bundles</text><rect x="1620" y="1170" width="450" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1632" y="1186" width="7" height="26" rx="4" fill="#17856b" stroke="#17856b" stroke-width="1.5" /><text x="1649" y="1207" font-size="22" fill="#17856b">GHCR</text><text x="1638" y="1238" font-size="16" fill="#425972">Signed packages · Sentinel images</text><text x="48" y="1412" font-size="17" fill="#596b82">Declared pipeline, not proof of every job passing. GitLab is deployment authority; GitHub package publishing is a separate path.</text><text x="48" y="1450" font-size="16" fill="#596b82">Blue: platform / application traffic     Green: persistence     Purple: identity / secrets     Orange: external services</text></g></svg>
