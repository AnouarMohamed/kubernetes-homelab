d k3s, not EKS; one AZ is not multi-AZ availability. Temporary resources are retired after tests.</text><text x="48" y="1450" font-size="16" fill="#596b82">Blue: platform / application traffic     Green: persistence     Purple: identity / secrets     Orange: external services</text></g></svg>
