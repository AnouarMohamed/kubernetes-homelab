<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500" role="img" aria-labelledby="title desc"><title id="title">Kubernetes homelab — Network boundaries · public ingress, private administration and pod encryption</title><desc id="desc">Target routing. WARP administration and Cilium WireGuard are distinct. Argo CD administration used local port-forward during validation.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#326ce5"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c86a12"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17856b"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8054bd"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64e64"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#596b82"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="2200" height="1500" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="48" y="69" font-size="43" fill="#162c47">Kubernetes homelab</text><text x="49" y="110" font-size="23" fill="#596b82">Network boundaries · public ingress, private administration and pod encryption</text><rect x="470" y="170" width="450" height="610" rx="12" fill="#fff6ec" stroke="#c86a12" stroke-width="1.5" stroke-dasharray="8 6"/><text x="490" y="203" font-size="20" fill="#c86a12">Cloudflare boundary</text><rect x="1020" y="170" width="1120" height="610" rx="12" fill="#eff5ff" s