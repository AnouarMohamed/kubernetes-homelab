roke-width="1.5" /><text x="925.8" y="582.5" font-size="14" fill="#8054bd">private route</text><polyline points="1450,605 1510,665" fill="none" stroke="#8054bd" stroke-width="2"  marker-end="url(#purple)"/><polyline points="460,1060 590,1060" fill="none" stroke="#326ce5" stroke-width="2"  marker-end="url(#blue)"/><rect x="499.6" y="1034" width="56.8" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="504.6" y="1050" font-size="14" fill="#326ce5">policy</text><polyline points="980,1060 1110,1060" fill="none" stroke="#326ce5" stroke-width="2"  marker-end="url(#blue)"/><rect x="1009.4" y="1034" width="80.2" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1014.4" y="1050" font-size="14" fill="#326ce5">encrypted</text><polyline points="1500,1060 1640,1060" fill="none" stroke="#326ce5" stroke-width="2"  marker-end="url(#blue)"/><rect x="1541.2" y="1034" width="64.6" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1546.2" y="1050" font-size="14" fill="#326ce5">deliver</text><rect x="60" y="210" width="310" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="72" y="226" width="7" height="26" rx="4" fill="#c86a12" stroke="#c86a12" stroke-width="1.5" /><text x="89" y="247" font-size="22" fill="#c86a12">Public browser</text><text x="78" y="278" font-size="16" fill="#425972">HTTPS read-only status</text><rect x="60" y="495" width="310" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="72" y="511" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="89" y="532" font-size="22" fill="#8054bd">Administrator + WARP</text><text x="78" y="563" font-size="16" fill="#425972">Enrolled private-network client</text><rect x="510" y="245" width="370" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="522" y="261" width="7" height="26" rx="4" fill="#c86a12" stroke="#c86a12" stroke-width="1.5" /><text x="539" y="282" font-size="22" fill="#c86a12">Public DNS + TLS</text><text x="528" y="313" font-size="16" fill="#425972">Explicit Tunnel hostnames</text><rect x="510" y="530" width="370" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="522" y="546" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="539" y="567" font-size="22" fill="#8054bd">Private-network route</text><text x="528" y="598" font-size="16" fill="#425972">WARP + split DNS</text><rect x="1060" y="250" width="390" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1072" y="266" width="7" height="26" rx="4" fill="#c86a12" stroke="#c86a12" stroke-width="1.5" /><text x="1089" y="287" font-size="22" fill="#c86a12">cloudflared replicas</text><text x="1078" y="318" font-size="16" fill="#425972">Outbound Tunnel connection</text><rect x="1510" y="250" width="350" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1522" y="266" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1539" y="287" font-size="22" fill="#326ce5">Public Gateway</text><text x="1528" y="318" font-size="16" fill="#425972">Selected public routes</text><rect x="1510" y="430" width="350" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1522" y="446" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1539" y="467" font-size="22" fill="#326ce5">Sentinel status</text><text x="1528" y="498" font-size="16" fill="#425972">UI + read-only API</text><rect x="1060" y="555" width="390" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1072" y="571" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="1089" y="592" font-size="22" fill="#8054bd">Internal Gateway</text><text x="1078" y="623" font-size="16" fill="#425972">Private hostnames / service routes</text><rect x="1510" y="615" width="550" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1522" y="631" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="1539" y="652" font-size="22" fill="#8054bd">Private consoles</text><text x="1528" y="683" font-size="16" fill="#425972">Grafana · Hubble · internal apps</text><rect x="110" y="1010" width="350" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="122" y="1026" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="139" y="1047" font-size="22" fill="#326ce5">Source pod / node A</text><text x="128" y="1078" font-size="16" fill="#425972">Namespace identity + service rule</text><rect x="590" y="1010" width="390" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="602" y="1026" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="619" y="1047" font-size="22" fill="#326ce5">Cilium agent / node A</text><text x="608" y="1078" font-size="16" fill="#425972">Policy verdict + WireGuard peer</text><rect x="1110" y="1010" width="390" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1122" y="1026" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1139" y="1047" font-size="22" fill="#326ce5">Cilium agent / node B</text><text x="1128" y="1078" font-size="16" fill="#425972">WireGuard peer + policy verdict</text><rect x="1640" y="1010" width="440" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1652" y="1026" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1669" y="1047" font-size="22" fill="#326ce5">Destination pod / node B</text><text x="1658" y="1078" font-size="16" fill="#425972">Only allowed service ports</text><text x="115" y="1230" font-size="20" fill="#273d55">Separate LAN functions: kube-vip advertises the API VIP via ARP; Cilium advertises selected LoadBalancer addresses via L2.</text><text x="48" y="1412" font-size="17" fill="#596b82">Target routing. WARP administration and Cilium WireGuard are distinct. Argo CD administration used local port-forward during validation.</text><text x="48" y="1450" font-size="16" fill="#596b82">Blue: platform / application traffic     Green: persistence     Purple: identity / secrets     Orange: external services</text></g></svg>
