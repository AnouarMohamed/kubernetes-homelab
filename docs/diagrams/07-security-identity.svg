<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500" role="img" aria-labelledby="title desc"><title id="title">Kubernetes homelab — Security boundaries · bootstrap trust, runtime secrets, SSO and admission</title><desc id="desc">Declared controls. Manual OpenBao unseal remains a human boundary. Audit policies do not block admission; enforcement needs reviewed exceptions.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#326ce5"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c86a12"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17856b"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8054bd"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64e64"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#596b82"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="2200" height="1500" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="48" y="69" font-size="43" fill="#162c47">Kubernetes homelab</text><text x="49" y="110" font-size="23" fill="#596b82">Security boundaries · bootstrap trust, runtime secrets, SSO and admission</text><rect x="50" y="180" width="630" height="520" rx="12" fill="#f6f1fc" stroke="#8054bd" stroke-width="1.5" stroke-dasharray="8 6"/><text x="70" y="213" font-size="20" fill="#8054bd">Bootstrap / outside public Git</text><rect x="770" y="180" width="1380" height="520" rx="12" fill="#f6f1fc" stroke="#8054bd" stroke-width="1.5" stroke-dasharray="8 6"/><text x="790" y="213" font-size="20" fill="#8054bd">Runtime secrets / namespace-scoped access</text><rect x="50" y="800" width="1020" height="530" rx="12" fill="#f6f1fc" stroke="#8054bd" stroke-width="1.5" stroke-dasharray="8 6"/><text x="70" y="833" font-size="20" fill="#8054bd">Human identity / OIDC clients</text><rect x="1160" y="800" width="990" height="530" rx="12" fill="#fff1f4" stroke="#b64e64" stroke-width="1.5" stroke-dasharray="8 6"/><text x="1180" y="833" font-size="20" fill="#b64e64">Workload admission / detection</text><polyline points="365,370 365,470" fill="none" stroke="#8054bd" stroke-width="2"  marker-end="url(#purple)"/><rect x="336.2" y="394" width="64.6" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="341.2" y="410" font-size="14" fill="#8054bd">decrypt</text><polyline points="1175,332.5 1260,332.5" fill="none" stroke="#8054bd" stroke-width="2"  marker-end="url(#purple)"/><rect x="1198.9" y="306.5" width="41.2" height="24" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1203.9" y="322.5" font-size="14" fill="#8054bd">read</text><polyline points="1620,332.5 1710,332.5" fill="none" stroke="#8054bd" stroke-width="2"  marker-end="url(#purple)"/><rect x="1629.4" y="306.5" width="80.2" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1634.4" y="322.5" font-size="14" fill="#8054bd">reconcile</text><polyline points="1905,395 1905,530" fill="none" stroke="#8054bd" stroke-width="2"  marker-end="url(#purple)"/><rect x="1876.2" y="436.5" width="64.6" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1881.2" y="452.5" font-size="14" fill="#8054bd">consume</text><polyline points="430,1050 540,1050 540,950 650,950" fill="none" stroke="#8054bd" stroke-width="2"  marker-end="url(#purple)"/><rect x="530" y="918" width="41.2" height="24" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="535" y="934" font-size="14" fill="#8054bd">OIDC</text><polyline points="430,1050 540,1050 540,1180 650,1180" fill="none" stroke="#8054bd" stroke-width="2"  marker-end="url(#purple)"/><rect x="530" y="1148" width="41.2" height="24" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="535" y="1164" font-size="14" fill="#8054bd">OIDC</text><polyline points="1590,950 1710,950" fill="none" stroke="#b64e64" stroke-width="2"  marker-end="url(#red)"/><rect x="1617.8" y="924" width="72.4" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1622.8" y="940" font-size="14" fill="#b64e64">evaluate</text><polyline points="1905,1000 1905,1130" fill="none" stroke="#b64e64" stroke-width="2"  marker-end="url(#red)"/><rect x="1915" y="1048" width="127" height="24" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><text x="1920" y="1064" font-size="14" fill="#b64e64">admitted images</text><rect x="90" y="270" width="550" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="102" y="286" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="119" y="307" font-size="22" fill="#8054bd">Offline age identity</text><text x="108" y="338" font-size="16" fill="#425972">Private decryption key stays outside repository</text><rect x="90" y="470" width="550" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="102" y="486" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="119" y="507" font-size="22" fill="#8054bd">SOPS + KSOPS</text><text x="108" y="538" font-size="16" fill="#425972">Encrypted bootstrap credentials → Argo renderer</text><rect x="815" y="270" width="360" height="125" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="827" y="286" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="844" y="307" font-size="22" fill="#8054bd">OpenBao Raft</text><text x="833" y="338" font-size="16" fill="#425972">TLS · audit volume</text><text x="833" y="359.6" font-size="16" fill="#425972">Manual Shamir unseal</text><rect x="1260" y="270" width="360" height="125" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1272" y="286" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="1289" y="307" font-size="22" fill="#8054bd">External Secrets</text><text x="1278" y="338" font-size="16" fill="#425972">Kubernetes auth + read policy</text><rect x="1710" y="270" width="390" height="125" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1722" y="286" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="1739" y="307" font-size="22" fill="#8054bd">Kubernetes Secret</text><text x="1728" y="338" font-size="16" fill="#425972">Materialized in consumer namespace</text><rect x="1710" y="530" width="390" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1722" y="546" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1739" y="567" font-size="22" fill="#326ce5">Application pod</text><text x="1728" y="598" font-size="16" fill="#425972">Secret mount / environment</text><text x="815" y="560" font-size="20" fill="#8054bd">OpenBao policies constrain the paths ESO can read.</text><text x="815" y="599" font-size="19" fill="#273d55">Secret rotation follows declared refresh intervals.</text><rect x="90" y="1000" width="340" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="102" y="1016" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="119" y="1037" font-size="22" fill="#8054bd">Keycloak</text><text x="108" y="1068" font-size="16" fill="#425972">Realm · groups · MFA action</text><rect x="650" y="900" width="370" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="662" y="916" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="679" y="937" font-size="22" fill="#8054bd">Argo CD</text><text x="668" y="968" font-size="16" fill="#425972">Admin / read-only group mapping</text><rect x="650" y="1130" width="370" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="662" y="1146" width="7" height="26" rx="4" fill="#8054bd" stroke="#8054bd" stroke-width="1.5" /><text x="679" y="1167" font-size="22" fill="#8054bd">Grafana</text><text x="668" y="1198" font-size="16" fill="#425972">OIDC groups + local break-glass</text><rect x="1200" y="900" width="390" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1212" y="916" width="7" height="26" rx="4" fill="#326ce5" stroke="#326ce5" stroke-width="1.5" /><text x="1229" y="937" font-size="22" fill="#326ce5">Deployment request</text><text x="1218" y="968" font-size="16" fill="#425972">Digest + security context</text><rect x="1710" y="900" width="390" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1722" y="916" width="7" height="26" rx="4" fill="#b64e64" stroke="#b64e64" stroke-width="1.5" /><text x="1739" y="937" font-size="22" fill="#b64e64">Kyverno + PSA</text><text x="1728" y="968" font-size="16" fill="#425972">Audit → reviewed Enforce</text><rect x="1710" y="1130" width="390" height="100" rx="12" fill="#ffffff" stroke="#d0dbea" stroke-width="1.5" /><rect x="1722" y="1146" width="7" height="26" rx="4" fill="#b64e64" stroke="#b64e64" stroke-width="1.5" /><text x="1739" y="1167" font-size="22" fill="#b64e64">Trivy Operator</text><text x="1728" y="1198" font-size="16" fill="#425972">Workload image vulnerability reports</text><text x="48" y="1412" font-size="17" fill="#596b82">Declared controls. Manual OpenBao unseal remains a human boundary. Audit policies do not block admission; enforcement needs reviewed exceptions.</text><text x="48" y="1450" font-size="16" fill="#596b82">Blue: platform / application traffic     Green: persistence     Purple: identity / secrets     Orange: external services</text></g></svg>
