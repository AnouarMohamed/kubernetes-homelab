---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-security-posture-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-security-posture-dashboard
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: homelab-security
    grafana_dashboard: '1'
data:
  security-posture.json: |-
    {
      "annotations": {"list": []},
      "description": "Actionable image-vulnerability exposure reported by Trivy Operator. Unknown means the scanner is not providing data and is never treated as healthy.",
      "editable": false,
      "panels": [
        {"collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}, "id": 1, "panels": [], "title": "Exposure posture", "type": "row"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Critical vulnerabilities in images currently represented by Trivy metrics.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 0, "y": 1}, "id": 2, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(trivy_image_vulnerabilities{severity=\"Critical\"})", "instant": true, "refId": "A"}], "title": "Critical findings", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "High-severity vulnerabilities in images currently represented by Trivy metrics.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 25}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 6, "y": 1}, "id": 3, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(trivy_image_vulnerabilities{severity=\"High\"})", "instant": true, "refId": "A"}], "title": "High findings", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Namespaces containing at least one critical or high finding.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 12, "y": 1}, "id": 4, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(count by (namespace) (trivy_image_vulnerabilities{severity=~\"Critical|High\"} > 0))", "instant": true, "refId": "A"}], "title": "Affected namespaces", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "All critical and high vulnerabilities that should enter the remediation queue.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 50}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 18, "y": 1}, "id": 5, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(trivy_image_vulnerabilities{severity=~\"Critical|High\"})", "instant": true, "refId": "A"}], "title": "Actionable findings", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Critical and high findings ranked by namespace so remediation starts where exposure is concentrated.", "fieldConfig": {"defaults": {"min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 25}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 9, "w": 14, "x": 0, "y": 6}, "id": 6, "options": {"displayMode": "gradient", "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"}, "maxVizHeight": 300, "minVizHeight": 16, "minVizWidth": 8, "namePlacement": "auto", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "showUnfilled": true, "sizing": "auto", "valueMode": "color"}, "targets": [{"expr": "sum by (namespace, severity) (trivy_image_vulnerabilities{severity=~\"Critical|High\"})", "instant": true, "legendFormat": "{{namespace}} / {{severity}}", "refId": "A"}], "title": "Exposure by namespace", "type": "bargauge"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Finding distribution by severity. Critical and high drive the immediate remediation queue; lower severities remain visible for planning.", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 9, "w": 10, "x": 14, "y": 6}, "id": 7, "options": {"displayLabels": ["name", "value"], "legend": {"displayMode": "table", "placement": "right", "showLegend": true, "values": ["value"]}, "pieType": "donut", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "tooltip": {"hideZeros": false, "mode": "single", "sort": "none"}}, "targets": [{"expr": "sum by (severity) (trivy_image_vulnerabilities)", "instant": true, "legendFormat": "{{severity}}", "refId": "A"}], "title": "Findings by severity", "type": "piechart"}
      ],
      "refresh": "5m", "schemaVersion": 42, "tags": ["homelab", "security", "trivy", "drilldown"], "templating": {"list": []}, "time": {"from": "now-24h", "to": "now"}, "timepicker": {"refresh_intervals": ["1m", "5m", "15m"], "time_options": ["6h", "24h", "2d", "7d"]}, "timezone": "browser", "title": "Homelab / Security posture", "uid": "homelab-security-posture", "version": 2
    }
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-security-findings
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-security-findings
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: homelab-security
    release: monitoring
spec:
  groups:
    - name: homelab.security
      rules:
        - alert: CriticalContainerVulnerabilityDetected
          expr: sum(trivy_image_vulnerabilities{severity="Critical"}) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Trivy reports a critical container-image vulnerability
            description: Review the Trivy report and rebuild or replace the affected image.
            runbook_url: https://gitlab.com/${CONFIG_GITLAB_PROJECT_PATH}/-/blob/main/docs/runbooks/respond-to-security-findings.md#critical-container-vulnerability-detected
