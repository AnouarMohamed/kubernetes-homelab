:"timeseries"}],"refresh":"30s","schemaVersion":42,"tags":["homelab","argocd","drilldown"],"time":{"from":"now-6h","to":"now"},"title":"Homelab / Argo CD","uid":"homelab-argocd","version":2}
  longhorn.json: |-
    {
      "annotations": {"list": []},
      "description": "Storage durability, capacity pressure, I/O, and recovery-point freshness from Longhorn.",
      "panels": [
        {"collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}, "id": 1, "panels": [], "title": "Protection posture", "type": "row"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Longhorn volumes currently reporting healthy robustness.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 0, "y": 1}, "id": 2, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(longhorn_volume_robustness{state=\"healthy\"} == 1)", "instant": true, "refId": "A"}], "title": "Healthy volumes", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Volumes in degraded or faulted state. Any non-zero value needs immediate investigation.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 6, "y": 1}, "id": 3, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(longhorn_volume_robustness{state=~\"degraded|faulted\"} == 1) or (0 * count(longhorn_volume_robustness{state=\"healthy\"}))", "instant": true, "refId": "A"}], "title": "Volumes at risk", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Replicas in error or unknown runtime state.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 12, "y": 1}, "id": 4, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(longhorn_replica_state{state=~\"error|unknown\"} == 1) or (0 * count(longhorn_replica_state{state=\"running\"}))", "instant": true, "refId": "A"}], "title": "Replica errors", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Age of the newest successful Longhorn volume backup. Red means the recovery point is older than 48 hours.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 24}, {"color": "red", "value": 48}]}, "unit": "h"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 18, "y": 1}, "id": 5, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "(time() - max(longhorn_volume_last_backup_at)) / 3600", "instant": true, "refId": "A"}], "title": "Newest backup age", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Longhorn storage used on each node as a fraction of capacity.", "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 14, "lineWidth": 2, "showPoints": "never", "spanNulls": true}, "max": 1, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.7}, {"color": "red", "value": 0.85}]}, "unit": "percentunit"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 0, "y": 6}, "id": 6, "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes", "legendFormat": "{{node}}", "refId": "A"}], "title": "Node storage pressure", "type": "timeseries"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Allocated bytes compared with requested volume capacity, grouped by persistent volume.", "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 14, "lineWidth": 2, "showPoints": "never", "spanNulls": true}, "max": 1, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.75}, {"color": "red", "value": 0.9}]}, "unit": "percentunit"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 8, "y": 6}, "id": 7, "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes", "legendFormat": "{{pvc_namespace}} / {{pvc}}", "refId": "A"}], "title": "Volume allocation pressure", "type": "timeseries"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Current read and write throughput by volume. A sudden sustained rise helps identify noisy storage consumers.", "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true}, "min": 0, "unit": "Bps"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 6}, "id": 8, "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum by (volume) (longhorn_volume_read_throughput)", "legendFormat": "read {{volume}}", "refId": "A"}, {"expr": "sum by (volume) (longhorn_volume_write_throughput)", "legendFormat": "write {{volume}}", "refId": "B"}], "title": "Volume throughput", "type": "timeseries"}
      ],
      "refresh": "30s", "schemaVersion": 42, "tags": ["homelab", "longhorn", "drilldown"], "time": {"from": "now-6h", "to": "now"}, "timepicker": {"refresh_intervals": ["30s", "1m", "5m"], "time_options": ["1h", "6h", "24h", "2d", "7d"]}, "timezone": "browser", "title": "Homelab / Longhorn", "uid": "homelab-longhorn", "version": 3
    }
  postgres.json: |-
    {
      "annotations": {"list": []},
      "description": "CloudNativePG availability, replication safety, archive freshness, and workload activity.",
      "panels": [
        {"collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}, "id": 1, "panels": [], "title": "Database posture", "type": "row"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "CloudNativePG instances whose collector is reachable and healthy.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 0, "y": 1}, "id": 2, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(cnpg_collector_up)", "instant": true, "refId": "A"}], "title": "Healthy instances", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "CloudNativePG collectors reporting unhealthy. Any non-zero value indicates lost database visibility or availability.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 6, "y": 1}, "id": 3, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(cnpg_collector_up == 0) or (0 * count(cnpg_collector_up))", "instant": true, "refId": "A"}], "title": "Unhealthy instances", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Maximum observed replication lag. Sustained lag reduces failover confidence.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 5}, {"color": "red", "value": 30}]}, "unit": "s"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 12, "y": 1}, "id": 4, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "max(cnpg_pg_replication_lag)", "instant": true, "refId": "A"}], "title": "Maximum replica lag", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Number of database clusters currently exposing a primary instance.", "fieldConfig": {"defaults": {"noValue": "Unknown", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "short"}, "overrides": []}, "gridPos": {"h": 5, "w": 6, "x": 18, "y": 1}, "id": 5, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(cnpg_pg_replication_in_recovery == 0)", "instant": true, "refId": "A"}], "title": "Primary clusters", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Replication lag by namespace and instance. Flat lines at zero indicate caught-up replicas.", "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true}, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 5}, {"color": "red", "value": 30}]}, "unit": "s"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 0, "y": 6}, "id": 6, "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "cnpg_pg_replication_lag", "legendFormat": "{{namespace}} / {{pod}}", "refId": "A"}], "title": "Replication lag", "type": "timeseries"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Seconds since the last successful WAL archive on each database namespace. This is the recovery-point freshness signal.", "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true}, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 900}, {"color": "red", "value": 3600}]}, "unit": "s"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 8, "y": 6}, "id": 7, "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "max by (namespace) (cnpg_pg_stat_archiver_seconds_since_last_archival)", "legendFormat": "{{namespace}}", "refId": "A"}], "title": "WAL archive freshness", "type": "timeseries"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Committed transactions per second by namespace, showing useful database activity rather than raw inventory.", "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true}, "min": 0, "unit": "ops"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 6}, "id": 8, "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum by (namespace) (rate(cnpg_pg_stat_database_xact_commit{datname!~\"template.*\"}[5m]))", "legendFormat": "{{namespace}}", "refId": "A"}], "title": "Committed transactions", "type": "timeseries"}
      ],
      "refresh": "30s", "schemaVersion": 42, "tags": ["homelab", "postgres", "drilldown"], "time": {"from": "now-6h", "to": "now"}, "timepicker": {"refresh_intervals": ["30s", "1m", "5m"], "time_options": ["1h", "6h", "24h", "2d", "7d"]}, "timezone": "browser", "title": "Homelab / PostgreSQL", "uid": "homelab-postgres", "version": 3
    }
